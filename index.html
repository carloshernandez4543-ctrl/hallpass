<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hall Pass — Free Browser Games</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="description" content="A small library of free browser games. No download, no sign-up, works on a school laptop.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Archivo:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="masthead">
  <div class="wrap">
    <a href="index.html" class="logo">Hall<span>.</span>Pass</a>
    <div class="masthead-meta" id="counter">— games</div>
  </div>
</header>

<main>
  <div class="wrap">
    <aside class="bookmark-tip" id="bookmark-tip" hidden>
      <p class="bookmark-eyebrow">Keep your pass</p>
      <p class="bookmark-line" id="bookmark-line"></p>
    </aside>

    <div class="toolbar">
      <div class="filters" id="filters" role="group" aria-label="Filter games by category"></div>
      <div class="search">
        <label class="sr-only" for="q">Search games by name</label>
        <input id="q" type="search" placeholder="Search games" autocomplete="off" spellcheck="false">
      </div>
    </div>

    <section class="recent" id="recent" aria-label="Recently played" hidden>
      <p class="recent-head">Recently played</p>
      <div class="recent-strip" id="recent-strip"></div>
    </section>

    <div class="grid" id="grid">
      <p class="empty" id="empty" hidden></p>
    </div>
  </div>
</main>

<footer class="foot">
  <div class="wrap">
    <span>Hall Pass</span>
    <span>Games provided by their respective developers</span>
  </div>
  <div class="foot-legal">
    <p class="foot-note">Hall Pass provides browser-based games for casual use. It is not affiliated with any school or district.</p>
  </div>
</footer>

<script src="assets/games.js"></script>
<script>
  const grid    = document.getElementById("grid");
  const filters = document.getElementById("filters");
  const counter = document.getElementById("counter");
  const search  = document.getElementById("q");
  const empty   = document.getElementById("empty");
  const recent      = document.getElementById("recent");
  const recentStrip = document.getElementById("recent-strip");

  let active = "All";
  let query  = "";

  counter.textContent = GAMES.length + " games";
  search.placeholder = "Search " + GAMES.length + " games";

  /* A phone has no Ctrl+D, so the shortcut wording would be a lie
     there. Branch on whether touch is the primary input, not on the
     operating system -- a touchscreen laptop still has a keyboard and
     reports a fine pointer. */
  (function bookmarkTip() {
    const tip  = document.getElementById("bookmark-tip");
    const line = document.getElementById("bookmark-line");
    const touchFirst = window.matchMedia("(hover: none) and (pointer: coarse)").matches;

    if (touchFirst) {
      const iOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                  (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      line.textContent = iOS
        ? "Add Hall Pass to your home screen \u2014 tap Share, then Add to Home Screen."
        : "Add Hall Pass to your home screen from your browser menu.";
    } else {
      const mac = /Mac/.test(navigator.platform || navigator.userAgent);
      const key = (label) => {
        const k = document.createElement("kbd");
        k.textContent = label;
        return k;
      };
      line.append("Bookmark this page \u2014 ", key(mac ? "\u2318" : "Ctrl"), " + ",
                  key("D"), " \u2014 so you can find it again tomorrow.");
    }
    tip.hidden = false;
  })();

  function makeCard(g, i) {
    const a = document.createElement("a");
    a.className = "pass";
    a.href = "game.html?g=" + gameSlug(g);
    a.innerHTML = `
      <img class="pass-thumb" src="${gameThumb(g)}" alt="" loading="lazy" width="512" height="384">
      <div class="pass-body">
        <div class="pass-no">
          <span>No. ${String(i + 1).padStart(3, "0")}</span>
          <span class="pass-cat">${g.cat}</span>
        </div>
        <p class="pass-name">${g.name}</p>
      </div>`;
    return a;
  }

  /* ---------- recently played, from this visitor's own browser ---------- */

  function readRecent() {
    let ids;
    try {
      ids = JSON.parse(localStorage.getItem("hallpass:recent") || "[]");
    } catch (e) {
      return [];                     // storage blocked, or unreadable
    }
    if (!Array.isArray(ids)) return [];
    return ids
      .map(id => GAMES.findIndex(g => g.id === id))
      .filter(i => i !== -1)         // drop games no longer in the library
      .slice(0, 6);
  }

  const recentIdx = readRecent();
  recentIdx.forEach(i => recentStrip.appendChild(makeCard(GAMES[i], i)));

  /* ---------- category chips ---------- */

  const cats = ["All", ...[...new Set(GAMES.map(g => g.cat))].sort()];

  cats.forEach(c => {
    const b = document.createElement("button");
    b.className = "chip";
    b.type = "button";
    b.textContent = c;
    b.setAttribute("aria-pressed", c === active);
    b.addEventListener("click", () => {
      active = c;
      [...filters.children].forEach(x =>
        x.setAttribute("aria-pressed", x.textContent === c));
      apply();
    });
    filters.appendChild(b);
  });

  /* Every card is built once. Filtering only toggles visibility, so
     typing in the search box never re-creates the thumbnails. */
  const cards = GAMES.map((g, i) => {
    const el = makeCard(g, i);
    grid.appendChild(el);
    return { el, cat: g.cat, name: g.name.toLowerCase() };
  });

  function apply() {
    let shown = 0;
    for (const c of cards) {
      const hit = (active === "All" || c.cat === active) &&
                  (query === "" || c.name.includes(query));
      c.el.hidden = !hit;
      if (hit) shown++;
    }

    empty.hidden = shown > 0;
    if (!shown) {
      empty.textContent = query
        ? "No games match “" + search.value.trim() + "”."
        : "Nothing in this category yet.";
    }

    /* The row is a shortcut for browsing, so it steps out of the way
       once the visitor is filtering or searching for something. */
    recent.hidden = recentIdx.length === 0 || active !== "All" || query !== "";
  }

  search.addEventListener("input", () => {
    query = search.value.trim().toLowerCase();
    apply();
  });

  apply();
</script>

</body>
</html>
