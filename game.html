<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hall Pass</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="description" content="Play free browser games on Hall Pass.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Archivo:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="masthead">
  <div class="wrap">
    <a href="index.html" class="logo">Hall<span>.</span>Pass</a>
    <div class="masthead-meta" id="crumb"></div>
  </div>
</header>

<main class="wrap">
  <div class="player-head">
    <div>
      <a href="index.html" class="back">← All games</a>
      <h1 id="title">Loading…</h1>
    </div>
    <button class="fullscreen-btn" id="fs" type="button">Fullscreen</button>
  </div>

  <div class="stage" id="stage"></div>

  <p class="more-head">More to play</p>
  <div class="grid" id="more"></div>
</main>

<footer class="foot">
  <div class="wrap">
    <span>Hall Pass</span>
    <span>Games provided by their respective developers</span>
  </div>
  <div class="foot-legal">
    <p class="foot-note">Hall Pass provides browser-based games for casual use. It is not affiliated with any school or district.</p>
  </div>
</footer>

<script src="assets/games.js"></script>
<script>
  const slug  = new URLSearchParams(location.search).get("g");
  const game  = slug ? findGame(slug) : null;
  const stage = document.getElementById("stage");

  if (!game) {
    document.getElementById("title").textContent = "Game not found";
    stage.remove();
    document.getElementById("fs").remove();
  } else {
    /* remember this game for the homepage "Recently played" row.
       Wrapped because storage can be disabled or full, in which case
       the row simply never appears. */
    try {
      const KEY  = "hallpass:recent";
      const seen = JSON.parse(localStorage.getItem(KEY) || "[]");
      const list = Array.isArray(seen) ? seen : [];
      localStorage.setItem(KEY, JSON.stringify(
        [game.id, ...list.filter(id => id !== game.id)].slice(0, 12)));
    } catch (e) { /* no storage, no history */ }

    document.title = game.name + " — Hall Pass";
    document.getElementById("title").textContent = game.name;
    document.getElementById("crumb").textContent = game.cat;

    if (game.ratio === "tall") stage.classList.add("tall");

    const frame = document.createElement("iframe");
    frame.src = gameUrl(game);
    frame.title = game.name;
    frame.setAttribute("allow", "fullscreen; autoplay; gamepad");
    frame.setAttribute("allowfullscreen", "");
    frame.setAttribute("scrolling", "no");
    stage.appendChild(frame);

    /* Fullscreen hides the whole page, so the way out has to live
       inside the stage. Both controls drive the same state, and the
       label is set from fullscreenchange rather than from the click,
       so leaving with Esc keeps everything in sync. */
    const fsBtn   = document.getElementById("fs");
    const overlay = document.createElement("div");
    overlay.className = "stage-overlay";
    const exitBtn = document.createElement("button");
    exitBtn.className = "stage-exit";
    exitBtn.type = "button";
    exitBtn.textContent = "Exit fullscreen";
    const hint = document.createElement("span");
    hint.className = "stage-hint";
    hint.textContent = "Esc to exit";
    overlay.append(exitBtn, hint);
    stage.appendChild(overlay);

    /* iOS Safari has no Fullscreen API for ordinary elements, so the
       real call would fail silently and the button would look dead.
       Where it is missing we expand the stage to the viewport with
       fixed positioning instead, which is a genuine fill rather than a
       pretend one -- the browser's own chrome simply stays put. */
    const nativeFs =
      !!(document.fullscreenEnabled || document.webkitFullscreenEnabled) &&
      !!(stage.requestFullscreen || stage.webkitRequestFullscreen);

    let expanded = false;   // only consulted when nativeFs is false

    const call = (fn, ctx) => {
      if (!fn) return;
      try {
        const r = fn.call(ctx);
        if (r && typeof r.catch === "function") r.catch(() => {});
      } catch (e) { /* refused, sync() will leave the label alone */ }
    };
    const fsTarget = () => document.fullscreenElement || document.webkitFullscreenElement || null;
    const isOpen = () => (nativeFs ? fsTarget() === stage : expanded);

    const open = () => {
      if (nativeFs) call(stage.requestFullscreen || stage.webkitRequestFullscreen, stage);
      else { expanded = true; sync(); }
    };
    const close = () => {
      if (nativeFs) call(document.exitFullscreen || document.webkitExitFullscreen, document);
      else { expanded = false; sync(); }
    };

    function sync() {
      const on = isOpen();
      fsBtn.textContent = on ? "Exit fullscreen" : "Fullscreen";
      fsBtn.setAttribute("aria-pressed", String(on));
      stage.classList.toggle("is-fullscreen", nativeFs && on);
      stage.classList.toggle("is-expanded", !nativeFs && on);
      /* only lock the page behind the fallback; real fullscreen already
         takes the document out of the flow */
      document.body.classList.toggle("stage-open", !nativeFs && on);
    }

    fsBtn.addEventListener("click", () => (isOpen() ? close() : open()));
    exitBtn.addEventListener("click", close);
    document.addEventListener("fullscreenchange", sync);
    document.addEventListener("webkitfullscreenchange", sync);
    /* the browser handles Esc for real fullscreen but not for the
       fallback, so cover that case ourselves */
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && !nativeFs && expanded) close();
    });
    sync();
  }

  /* --- "more to play": 6 others, shuffled --- */
  const more = document.getElementById("more");
  GAMES.filter(g => !game || g.id !== game.id)
       .sort(() => Math.random() - 0.5)
       .slice(0, 6)
       .forEach(g => {
    const a = document.createElement("a");
    a.className = "pass";
    a.href = "game.html?g=" + gameSlug(g);
    a.innerHTML = `
      <img class="pass-thumb" src="${gameThumb(g)}" alt="" loading="lazy" width="512" height="384">
      <div class="pass-body">
        <div class="pass-no">
          <span>No. ${String(GAMES.indexOf(g) + 1).padStart(3, "0")}</span>
          <span class="pass-cat">${g.cat}</span>
        </div>
        <p class="pass-name">${g.name}</p>
      </div>`;
    more.appendChild(a);
  });
</script>

</body>
</html>
